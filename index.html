<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>사이트 운영 종료</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f3f5f8;
      color: #1f2937;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
        "Noto Sans KR", sans-serif;
    }

    main {
      width: min(100%, 520px);
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      padding: 42px 30px;
      background: white;
      box-shadow: 0 16px 48px rgba(15, 23, 42, 0.08);
      text-align: center;
    }

    .icon {
      display: grid;
      width: 58px;
      height: 58px;
      margin: 0 auto 18px;
      place-items: center;
      border-radius: 16px;
      background: #eef2ff;
      font-size: 28px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      letter-spacing: -0.5px;
    }

    p {
      margin: 12px 0 0;
      color: #64748b;
      font-size: 15px;
      line-height: 1.7;
    }

    small {
      display: block;
      margin-top: 24px;
      color: #94a3b8;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">🏠</div>
    <h1>사이트 운영이 종료되었습니다</h1>
    <p>입주 준비가 완료되어 이 대시보드의 운영을 종료했습니다.</p>
    <small>2026년 9월 27일 종료</small>
  </main>
</body>
</html>
